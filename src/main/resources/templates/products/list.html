<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Product Shop — Lab 8</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1 style="margin-bottom: 1.3em">
        🛍️ Product Shop
        <span class="badge">Lab 8 — 1:1 &amp; 1:N Relationship</span>
      </h1>

      <!-- Success message -->
      <div
        class="alert alert-success"
        th:if="${message}"
        th:text="${message}"
      ></div>

      <button
        type="button"
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#addModal"
      >
        + เพิ่มสินค้าใหม่
      </button>
      <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
          <div class="modal-content p-3">
            <div th:replace="products/add :: addFormContent"></div>
          </div>
        </div>
      </div>
      <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
          <div class="modal-content p-3" id="editModalBody"></div>
        </div>
      </div>
      <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content p-3" id="deleteModalBody"></div>
        </div>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>ชื่อสินค้า</th>
            <th>หมวดหมู่</th>
            <th>ยี่ห้อ</th>
            <th>คลัง</th>
            <th>ราคา (บาท)</th>
            <th>ส่วนลด</th>
            <th>ราคาสุทธิ</th>
            <th>รับประกัน (1:1)</th>
            <th>น้ำหนัก (1:1)</th>
            <th>รีวิว (1:N)</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.category}"></td>
            <td th:text="${product.brand}"></td>
            <td th:text="${product.stock}"></td>
            <td
              th:text="${product.price != null ? #numbers.formatDecimal(product.price, 1, 2) : '0.00'}"
            ></td>
            <td th:text="${product.discountType}"></td>
            <td
              th:text="${product.discountedPrice != null ? #numbers.formatDecimal(product.discountedPrice, 1, 2) : '0.00'}"
            ></td>
            <td
              th:text="${product.detail != null ? product.detail.warranty : '-'}"
            ></td>
            <td
              th:text="${product.detail != null ? product.detail.weight : '-'}"
            ></td>
            <td
              th:text="${product.reviews != null ? product.reviews.size() + ' รีวิว' : '0 รีวิว'}"
            ></td>
            <td>
              <button
                type="button"
                class="btn btn-sm btn-warning"
                th:onclick="|openEditModal('${product.id}')|"
              >
                แก้ไข
              </button>
              <button
                type="button"
                class="btn btn-sm btn-danger"
                th:onclick="|openDeleteModal('${product.id}')|"
              >
                ลบ
              </button>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="12" class="text-center">
              ยังไม่มีสินค้า — กด "+ เพิ่มสินค้าใหม่" เพื่อเริ่มต้น
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      function openEditModal(id) {
        fetch("/products/edit/" + id)
          .then((response) => {
            if (!response.ok) {
              throw new Error("Server error: " + response.status);
            }
            return response.text();
          })
          .then((html) => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            const formContent = doc.querySelector("form");

            if (formContent) {
              document.getElementById("editModalBody").innerHTML = "";
              document.getElementById("editModalBody").appendChild(formContent);

              var myModal = new bootstrap.Modal(
                document.getElementById("editModal"),
              );
              myModal.show();
            } else {
              console.error("ไม่พบฟอร์มแก้ไขในหน้าเว็บที่โหลดมา");
            }
          })
          .catch((error) => {
            console.error("Error loading edit form:", error);
            alert("เกิดข้อผิดพลาดในการโหลดข้อมูลแก้ไข กรุณาตรวจสอบ Console");
          });
      }
      function openDeleteModal(id) {
        fetch("/products/delete/" + id)
          .then((response) => {
            if (!response.ok) {
              throw new Error("Server error: " + response.status);
            }
            return response.text();
          })
          .then((html) => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            const deleteContent =
              doc.querySelector(".container") || doc.querySelector("form");

            if (deleteContent) {
              document.getElementById("deleteModalBody").innerHTML = "";
              document
                .getElementById("deleteModalBody")
                .appendChild(deleteContent);

              var myModal = new bootstrap.Modal(
                document.getElementById("deleteModal"),
              );
              myModal.show();
            } else {
              console.error("ไม่พบเนื้อหาการลบในหน้าที่โหลดมา");
            }
          })
          .catch((error) => {
            console.error("Error loading delete form:", error);
            alert("เกิดข้อผิดพลาดในการโหลดข้อมูลลบ กรุณาตรวจสอบ Console");
          });
      }
    </script>
  </body>
</html>
